# Generated template v1. Compatible with the pinned devenv 2.4.0 CLI.
# Only Nix modules are imported; remote devenv.yaml composition is not used.
require_version: "2.4.0"
secretspec:
  enable: false
inputs:
  devenv:
    url: github:cachix/devenv/v2.4.0?dir=src/modules
  nixpkgs:
    url: github:NixOS/nixpkgs/d5cc6833999746cffdfe0598f7bc801a57b887a9
  project-check:
    url: github:timfewi/project-check/main
    inputs:
      nixpkgs:
        follows: nixpkgs
